<head>

    <link rel="icon" type="image/png" sizes="32x32" href="/public/favicon-32x32.png?v=6">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/favicon-16x16.png?v=6">
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png?v=6">
    <meta name="description" content="A platform for students to explore, upload, and share creative works.">
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json?v=6">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <meta name="apple-mobile-web-app-title" content="EdTechra">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <link rel="stylesheet" href="/assets/css/styles.css?v=6">
    <link rel="stylesheet" href="/assets/css/explore_recovered.css?v=6">

</head>

<body>
    <!-- Auto-fullscreen on first interaction -->
    <script>
        (function () {
            function tryAutoFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log('Fullscreen requires user interaction'));
                }
                document.removeEventListener('click', tryAutoFullscreen, true);
                document.removeEventListener('keydown', tryAutoFullscreen, true);
            }
            document.addEventListener('click', tryAutoFullscreen, { once: true, capture: true });
            document.addEventListener('keydown', tryAutoFullscreen, { once: true, capture: true });

            document.addEventListener('fullscreenchange', () => {
                document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
            });
        })();
    </script>
    <div id="app">
        <!-- Navigation -->
        <nav class="main-nav">
            <div class="container">
                <a href="#" class="logo" id="nav-home" aria-label="Edtechra Home">
                    <img class="brand-logo brand-logo-main" src="/assets/logos/edtechra-logo-light.png" alt="Edtechra">
                </a>
                <div class="nav-links" id="nav-links">
                    <!-- Dynamic links injected here -->
                </div>
                <div class="nav-auth" id="nav-auth">
                    <!-- Auth buttons injected here -->
                </div>
                <button class="mobile-menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="container">
            <!-- Dynamic pages injected here -->
        </main>

        <!-- Global Mobile Bottom Navigation -->
        <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile navigation"></nav>

        <!-- Global Loader -->
        <div id="loader" class="page-loader hidden" role="status" aria-live="polite" aria-label="Preparing your creative space">
            <div class="edtechra-loader-card">
                <div class="edtechra-loader-orbit" aria-hidden="true">
                    <div class="edtechra-loader-logo">
                        <img src="/assets/logos/edtechra-icon-dark.png" alt="Edtechra">
                    </div>
                </div>
                <div class="edtechra-loader-copy">
                    <p class="edtechra-loader-eyebrow">EDTECHRA Studio</p>
                    <p class="edtechra-loader-text">Preparing your creative space...</p>
                </div>
                <div class="edtechra-loader-dots" aria-hidden="true">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-container"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/assets/js/app.js?v=project-badge-check"></script>
</body>

</html>
