<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join Classroom | Edtechra Digital Classroom</title>
    <link rel="stylesheet" href="assets/css/classroom.css">
  </head>
  <body class="student-page" data-page="join">
    <main class="main-content">
      <section class="join-classroom-shell">
        <div class="glass-panel join-card" id="join-classroom-panel">
          <p class="eyebrow">Classroom Invitation</p>
          <h1>Join Classroom?</h1>
          <p class="subtitle" id="join-classroom-summary">Loading classroom invitation...</p>

          <div class="join-classroom-meta" id="join-classroom-meta"></div>

          <div class="form-actions">
            <button class="btn btn-primary" type="button" id="join-classroom-btn">Join Classroom</button>
            <a class="btn btn-secondary" href="#home">Cancel</a>
          </div>
          <p id="join-classroom-notice" class="notice" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script type="module" src="assets/js/root-supabase-bridge.js"></script>
  </body>
</html>
